name: CIWSSim
options:
  bundleIdPrefix: com.obliscence
  deploymentTarget:
    visionOS: '2.0'
  xcodeVersion: '16.0'
packages:
  CIWSSimulation:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  CIWSSim:
    type: application
    platform: visionOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
      - path: ../sounds
        buildPhase: resources
        excludes:
          - src
          - '*.md'
    dependencies:
      - package: CIWSSimulation
        product: CIWSSimulation
      - package: CIWSSimulation
        product: CIWSSound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obliscence.ciwssim
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist  # launches onto the deck
        INFOPLIST_KEY_CFBundleDisplayName: Phalanx
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO  # Info.plist has it
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 7
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
